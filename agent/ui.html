<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3a;
      --accent:    #6c8eff;
      --accent-dim:#3a4a8a;
      --text:      #e2e4ef;
      --muted:     #6b7280;
      --user-bg:   #1e2235;
      --tool-bg:   #141820;
      --error:     #ff6b6b;
      --radius:    12px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .filter-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      width: 180px;
      transition: border-color 0.15s;
    }
    .filter-input::placeholder { color: var(--muted); }
    .filter-input:focus { border-color: var(--accent-dim); }

    /* ── Messages area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #messages:empty::after {
      content: "Ask anything about your messages…";
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      margin-top: 80px;
      display: block;
    }

    /* ── Message bubbles ── */
    .msg { display: flex; flex-direction: column; gap: 6px; max-width: 820px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      max-width: 100%;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .msg.assistant .bubble {
      background: transparent;
      color: var(--text);
    }

    /* ── Tool steps ── */
    .steps { display: flex; flex-direction: column; gap: 6px; width: 100%; }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      padding: 6px 10px;
      background: var(--tool-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .step-icon { flex-shrink: 0; }

    .step-body { flex: 1; min-width: 0; }

    .step-label {
      font-weight: 500;
      color: var(--accent);
    }

    .step-detail {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .step.result .step-label { color: #7ec8a0; }

    .step.error-step .step-label { color: var(--error); }

    /* ── Cursor blink ── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Input area ── */
    footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    #chat-form {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #query {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #query::placeholder { color: var(--muted); }
    #query:focus { border-color: var(--accent-dim); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #send-btn:hover { opacity: 0.85; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* scrollbar */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>Smart Search</h1>
  <div class="filters">
    <input class="filter-input" id="after"  type="text" placeholder="After (e.g. last 7 days)" />
    <input class="filter-input" id="before" type="text" placeholder="Before (e.g. 2024-12-31)" />
  </div>
</header>

<div id="messages"></div>

<footer>
  <form id="chat-form">
    <input id="query" type="text" placeholder="Ask anything about your messages…" autocomplete="off" />
    <button id="send-btn" type="submit">Send</button>
  </form>
</footer>

<script>
  const messagesEl = document.getElementById('messages');
  const form       = document.getElementById('chat-form');
  const queryEl    = document.getElementById('query');
  const sendBtn    = document.getElementById('send-btn');
  const afterEl    = document.getElementById('after');
  const beforeEl   = document.getElementById('before');

  const TOOL_ICONS = { search_messages: '🔍', graph_search: '🕸', grep: '🔎' };

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function createAssistantMessage() {
    const msg = document.createElement('div');
    msg.className = 'msg assistant';

    const steps = document.createElement('div');
    steps.className = 'steps';
    msg.appendChild(steps);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    msg.appendChild(bubble);

    messagesEl.appendChild(msg);
    scrollBottom();
    return { msg, steps, bubble };
  }

  function addStep(stepsEl, type, tool, detail) {
    const step = document.createElement('div');
    step.className = `step ${type}`;
    const icon = TOOL_ICONS[tool] || '⚙️';
    step.innerHTML = `
      <span class="step-icon">${icon}</span>
      <div class="step-body">
        <div class="step-label">${escHtml(labelFor(type, tool))}</div>
        ${detail ? `<div class="step-detail">${escHtml(detail)}</div>` : ''}
      </div>`;
    stepsEl.appendChild(step);
    scrollBottom();
    return step;
  }

  function labelFor(type, tool) {
    const labels = {
      tool_call: { search_messages: 'Searching messages…', graph_search: 'Graph search (PPR)…', grep: 'Running grep…' },
      result:    { search_messages: 'Messages retrieved',  graph_search: 'Graph results',        grep: 'Grep results'  },
    };
    if (type === 'error-step') return 'Error';
    return (labels[type] || {})[tool] || tool;
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function argsLabel(tool, args) {
    if (tool === 'search_messages') {
      let s = `"${args.query}"`;
      if (args.after)  s += ` · after ${args.after}`;
      if (args.before) s += ` · before ${args.before}`;
      return s;
    }
    if (tool === 'grep') {
      let s = `"${args.pattern}"`;
      if (args.path) s += ` in ${args.path}`;
      return s;
    }
    return JSON.stringify(args);
  }

  async function sendMessage(query) {
    sendBtn.disabled = true;
    queryEl.disabled = true;

    addUserMessage(query);
    const { steps, bubble } = createAssistantMessage();

    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);

    const body = JSON.stringify({
      query,
      after:  afterEl.value.trim() || null,
      before: beforeEl.value.trim() || null,
    });

    let pendingCallStep = null;

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          let event;
          try { event = JSON.parse(line.slice(6)); } catch { continue; }

          if (event.type === 'tool_call') {
            pendingCallStep = addStep(steps, 'tool_call', event.tool, argsLabel(event.tool, event.args));
          }

          if (event.type === 'tool_result') {
            // Update the pending call step to show it's done, then add result step
            if (pendingCallStep) {
              pendingCallStep.querySelector('.step-label').textContent =
                event.tool === 'search_messages' ? 'Messages retrieved' : 'Grep done';
              pendingCallStep.classList.add('result');
              pendingCallStep = null;
            }
          }

          if (event.type === 'token') {
            // Insert token before cursor
            bubble.insertBefore(document.createTextNode(event.content), cursor);
            scrollBottom();
          }

          if (event.type === 'error') {
            addStep(steps, 'error-step', 'error', event.content);
          }

          if (event.type === 'done') {
            cursor.remove();
          }
        }
      }
    } catch (err) {
      bubble.textContent = `Connection error: ${err.message}`;
      cursor.remove();
    }

    cursor.remove();
    sendBtn.disabled = false;
    queryEl.disabled = false;
    queryEl.focus();
    scrollBottom();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const q = queryEl.value.trim();
    if (!q || sendBtn.disabled) return;
    queryEl.value = '';
    sendMessage(q);
  });
</script>
</body>
</html>
